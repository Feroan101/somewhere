<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetHelp</title>

    <link rel="icon" href="sheep pp.jpg" type="image/jpeg">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #000;
            color: #fff;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
        }

        .content {
            width: 100%;
            max-width: 360px;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            line-height: 1.35;
            font-weight: 700;
        }

        h2 {
            margin: 8px 0 0;
            font-size: 14px;
            line-height: 1.4;
            font-weight: 400;
            font-style: italic;
            color: #aaa;
        }

        .tiny-line {
            position: fixed;
            bottom: 6px;
            left: 0;
            width: 100%;
            padding: 0 12px;
            font-size: 3px;
            line-height: 1;
            color: #666;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="content">
        <h1>You clicked a suspicious link just to stalk me.</h1>
        <h2>That's mildly concerning.</h2>
    </div>

    <div class="tiny-line">
        go ahead, stalk responsibly
    </div>

</body>
</html>
